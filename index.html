
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>FloodReady XR - Community Map</title>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
    }

    .map-controls {
      position: fixed;
      right: 16px;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .map-controls button {
      width: 46px;
      height: 46px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
      color: #263238;
      font-size: 25px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      touch-action: manipulation;
    }

    .map-controls button:active {
      background: #f1f5f9;
    }

    .map-controls .location {
      font-size: 24px;
      color: #1769aa;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="map-controls">
    <button onclick="zoomIn()" aria-label="Zoom in">+</button>
    <button onclick="zoomOut()" aria-label="Zoom out">−</button>
    <button class="location"
            onclick="resetLocation()"
            aria-label="Return to school location">⌖</button>
  </div>

  <script>
    const school = {
      lat: 1.865164,
      lng: 103.028806
    };

    let map;

    function initMap() {
      map = new google.maps.Map(
        document.getElementById("map"),
        {
          center: school,
          zoom: 16,
          minZoom: 12,
          maxZoom: 20,
          mapTypeId: "roadmap",
          disableDefaultUI: true,
          gestureHandling: "greedy"
        }
      );

      new google.maps.Marker({
        position: school,
        map: map,
        title: "SK Seri Gading"
      });
    }

    function zoomIn() {
      if (map) map.setZoom(map.getZoom() + 1);
    }

    function zoomOut() {
      if (map) map.setZoom(map.getZoom() - 1);
    }

    function resetLocation() {
      if (!map) return;

      map.panTo(school);
      map.setZoom(16);
    }
  </script>

  <!-- Replace this with your EXISTING Google Maps API script -->
  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAb3KGbjLBYeQPVPEFAxdwyGTxrB65x-7s&callback=initMap&loading=async">
  </script>
</body>
</html>
